# Fly.io config. Change `app` to the name you created with `fly launch --no-deploy` (or `fly apps create`).
app = "someday-stash"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  MEDIA_DIR = "/data/media"
  INLINE_PROCESS = "1"
  NEXT_TELEMETRY_DISABLED = "1"

# Give after()-scheduled AI/ffmpeg time to finish before a deploy kill.
kill_signal = "SIGTERM"
kill_timeout = "120s"

# Persistent disk for media. scripts/deploy.sh creates it (fly volumes create data --size 10).
[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine up: processing happens after the HTTP response and would be killed by auto-stop.
  # "no started VMs" / refused connection happens if this is left on or the process crashes without restart.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

# 2gb: Next + ten sequential photo intakes + ffmpeg/yt-dlp. 1gb OOMed on multi-Photo shares.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
  cpus = 1

[[restart]]
  policy = "always"
  retries = 10
