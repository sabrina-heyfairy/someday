# fly.toml app configuration file generated for someday-guhxxa on 2026-10-30T14:06:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'someday-guhxxa'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  INLINE_PROCESS = '1'
  MEDIA_DIR = '/data/media'
  NEXT_TELEMETRY_DISABLED = '1'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
